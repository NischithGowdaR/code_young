<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100" height="100">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0A2540" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Base Platform Ring -->
  <ellipse cx="50" cy="78" rx="34" ry="9" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" />
  <ellipse cx="50" cy="78" rx="22" ry="5.5" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" fill="none" />

  <!-- Upward Field Lines -->
  <path d="M 28 72 C 26 56, 32 44, 38 38" stroke="url(#streamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 72 72 C 74 56, 68 44, 62 38" stroke="url(#streamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 50 72 L 50 58" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.6" />

  <!-- Levitation Energy Pulse -->
  <ellipse cx="50" cy="62" rx="14" ry="3.5" stroke="#00F0FF" stroke-width="1" opacity="0.7" />

  <!-- Hovering Sphere -->
  <circle cx="50" cy="38" r="18" fill="url(#sphereGrad)" />
  <circle cx="50" cy="38" r="18" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.8" fill="none" />
</svg>
